<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="开篇 · Prelude 支持" />
    <link rel="stylesheet" href="./site.css" />
    <title>支持 · 开篇 Prelude</title>
  </head>
  <body>
    <main>
      <a class="brand" href="./index.html">
        <img src="./prelude.svg" alt="" />
        <strong>开篇 · Prelude</strong>
      </a>
      <p class="eyebrow">Support</p>
      <h1>需要帮助？</h1>
      <p class="lede">
        请在提交问题时说明 Chrome 版本、Prelude
        版本、复现步骤和预期结果。不要附上私人书签、完整浏览记录或其他敏感数据。
      </p>
      <section>
        <h2>常见检查</h2>
        <ul>
          <li>在 <code>chrome://extensions</code> 确认开篇已启用。</li>
          <li>确认扩展仍拥有书签与标签页权限。</li>
          <li>更新到最新版后重新打开新标签页。</li>
          <li>书签由 Chrome 保存；开篇不会建立远程账号或备份。</li>
        </ul>
        <div class="actions">
          <a href="https://github.com/yuzhouu/supposed/issues/new">提交问题</a>
          <a href="./privacy.html">隐私政策</a>
        </div>
      </section>
    </main>
  </body>
</html>
