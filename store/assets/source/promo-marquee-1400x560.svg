<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title description">
  <title id="title">序幕 · Prelude</title>
  <desc id="description">把 Chrome 书签、当前标签页与待读收集整合进安静的新标签页</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfc" />
      <stop offset="1" stop-color="#f5eeeb" />
    </linearGradient>
    <filter id="frameShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#5d3a34" flood-opacity="0.18" />
    </filter>
    <clipPath id="screenClip">
      <rect x="648" y="66" width="706" height="441" rx="18" />
    </clipPath>
  </defs>
  <rect width="1400" height="560" fill="url(#background)" />
  <circle cx="83" cy="33" r="210" fill="#dc4c3e" opacity="0.055" />
  <circle cx="1337" cy="525" r="190" fill="#dc4c3e" opacity="0.045" />

  <g transform="translate(74 82)">
    <rect width="70" height="70" rx="17" fill="#ffffff" stroke="#eadedb" />
    <image href="/icons/prelude.svg" x="13" y="8" width="44" height="54" preserveAspectRatio="xMidYMid meet" />
  </g>
  <text x="74" y="217" fill="#202020" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="48" font-weight="730" letter-spacing="-1.7">序幕 · Prelude</text>
  <text x="76" y="264" fill="#514b47" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="22" font-weight="600">江流天地外，山色有无中</text>
  <text x="76" y="315" fill="#6e6863" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="17">
    <tspan x="76" dy="0">把 Chrome 书签、当前标签页与待读收集，</tspan>
    <tspan x="76" dy="29">整合进一个安静的新标签页。</tspan>
  </text>
  <g transform="translate(76 392)">
    <rect width="208" height="39" rx="19.5" fill="#fce9e6" />
    <circle cx="21" cy="19.5" r="5" fill="#dc4c3e" />
    <text x="36" y="25" fill="#b43b31" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="13" font-weight="650">书签与标签页数据仅在本地处理</text>
  </g>

  <g filter="url(#frameShadow)">
    <rect x="636" y="54" width="730" height="465" rx="25" fill="#ffffff" />
    <g clip-path="url(#screenClip)">
      <image href="/store/assets/screenshots/zh-CN/01-bookmarks-1280x800.png" x="648" y="66" width="706" height="441" preserveAspectRatio="xMidYMid slice" />
    </g>
  </g>
</svg>
