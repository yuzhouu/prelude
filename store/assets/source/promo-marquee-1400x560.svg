<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title description">
  <title id="title">序幕 · 新标签页</title>
  <desc id="description">一个安静的新标签页，用来整理 Chrome 书签、当前标签页和待读内容。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f6f5f3" />
    </linearGradient>
    <filter id="frameShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#34302e" flood-opacity="0.13" />
    </filter>
    <clipPath id="screenClip">
      <rect x="640" y="68" width="704" height="440" rx="10" />
    </clipPath>
  </defs>
  <rect width="1400" height="560" fill="url(#background)" />
  <image href="/icons/prelude.svg" x="64" y="70" width="72" height="72" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif">
    <text x="150" y="103" fill="#ac493b" font-size="23" font-weight="650">Prelude</text>
    <text x="151" y="127" fill="#6f6b67" font-size="11" letter-spacing="1.5">CHROME NEW TAB</text>
    <text x="68" y="230" fill="#202020" font-size="46" font-weight="700" letter-spacing="-1.4">序幕 · 新标签页</text>
    <text x="70" y="283" fill="#5f5b57" font-size="20">
      <tspan x="70">一个安静的新标签页，用来整理</tspan>
      <tspan x="70" dy="34">Chrome 书签、当前标签页和待读内容。</tspan>
    </text>
    <text x="71" y="394" fill="#ac493b" font-size="15" font-weight="600">沿用 Chrome 书签 · 无需注册 · 没有广告</text>
    <text x="71" y="426" fill="#6f6b67" font-size="12">浅色与深色主题 / 六种界面语言</text>
  </g>
  <g filter="url(#frameShadow)">
    <rect x="628" y="56" width="728" height="464" rx="20" fill="#ffffff" stroke="#e5e1de" />
    <g clip-path="url(#screenClip)">
      <image href="/store/assets/screenshots/zh-CN/01-bookmarks-1280x800.png" x="640" y="68" width="704" height="440" />
    </g>
  </g>
</svg>
