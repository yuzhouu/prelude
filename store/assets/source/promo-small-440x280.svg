<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title description">
  <title id="title">序幕 · 新标签页</title>
  <desc id="description">一个安静的新标签页，用来整理 Chrome 书签、当前标签页和待读内容。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f6f5f3" />
    </linearGradient>
  </defs>
  <rect width="440" height="280" fill="url(#background)" />
  <image href="/icons/prelude.svg" x="28" y="25" width="68" height="68" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif">
    <text x="110" y="57" fill="#ac493b" font-size="20" font-weight="650">Prelude</text>
    <text x="111" y="79" fill="#6f6b67" font-size="11" letter-spacing="1.4">CHROME NEW TAB</text>
    <text x="32" y="150" fill="#202020" font-size="32" font-weight="700" letter-spacing="-0.7">序幕 · 新标签页</text>
    <text x="33" y="191" fill="#5f5b57" font-size="16">
      <tspan x="33">一个安静的新标签页，用来整理</tspan>
      <tspan x="33" dy="28">Chrome 书签、当前标签页和待读内容。</tspan>
    </text>
  </g>
  <rect x="33" y="245" width="36" height="3" rx="1.5" fill="#bf4d3f" />
</svg>
